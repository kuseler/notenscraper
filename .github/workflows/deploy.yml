name: Deploy Infrastructure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Lambda Dependency Layer
        run: |
          mkdir -p infra/build_layer/python
          python3 -m pip install \
            --platform manylinux2014_x86_64 \
            --target infra/build_layer/python \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            --upgrade \
            -r src/requirements.txt

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.0

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN || secrets.ROLE_ARN || vars.ROLE_ARN }}
          aws-region: eu-central-1

      - name: OpenTofu Init
        run: |
          if [ -n "$STATE_BUCKET_NAME" ]; then
            tofu -chdir=infra init -backend-config="bucket=$STATE_BUCKET_NAME"
          else
            tofu -chdir=infra init
          fi
        env:
          STATE_BUCKET_NAME: ${{ secrets.STATE_BUCKET_NAME || vars.STATE_BUCKET_NAME || secrets.BUCKET_NAME || vars.BUCKET_NAME }}

      - name: OpenTofu Plan
        run: tofu -chdir=infra plan -no-color
        env:
          TF_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL || vars.NOTIFICATION_EMAIL }}
          TF_VAR_scraper_username: ${{ secrets.SCRAPER_USERNAME || vars.SCRAPER_USERNAME }}
          TF_VAR_scraper_password: ${{ secrets.SCRAPER_PASSWORD }}
          TF_VAR_role_arn: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN || secrets.ROLE_ARN || vars.ROLE_ARN }}
          TF_VAR_state_bucket_name: ${{ secrets.STATE_BUCKET_NAME || vars.STATE_BUCKET_NAME || secrets.BUCKET_NAME || vars.BUCKET_NAME }}

      - name: OpenTofu Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: tofu -chdir=infra apply -auto-approve
        env:
          TF_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL || vars.NOTIFICATION_EMAIL }}
          TF_VAR_scraper_username: ${{ secrets.SCRAPER_USERNAME || vars.SCRAPER_USERNAME }}
          TF_VAR_scraper_password: ${{ secrets.SCRAPER_PASSWORD }}
          TF_VAR_role_arn: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN || secrets.ROLE_ARN || vars.ROLE_ARN }}
          TF_VAR_state_bucket_name: ${{ secrets.STATE_BUCKET_NAME || vars.STATE_BUCKET_NAME || secrets.BUCKET_NAME || vars.BUCKET_NAME }}
